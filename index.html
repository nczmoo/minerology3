<!doctype html>
<html lang="en">
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<title> </title>
	<style>
		body {
			margin: 0px;
			padding: 0px;
		}
		.buying{
			background-color: green
		}
		.cell {
			width: 20px;
			height: 20px;
			
			float: left;
			text-align: center;
			font-style: bold;
			padding: 0px;
			font-size: 20px;
			line-height: 20px;
		}
		.cell.dynamite-highlight, .cell.pending_destruction {
			border: 1px solid red;
			 box-shadow: 0 0 20px 10px red;
		}
		.cell:not(.sky, .empty, .dynamite-highlight){
			border: 1px solid black;
		}
		.cell.sky, .cell.empty{
			border: 1px dashed grey;
		}
		.coal{
			background-color: grey;
		}
		.dirt{
			background-color: burlywood;
		}
		.empty:not(.buying){
			background-color: black;
			color: white;
		}
		.iron{
			background-color: red;
		}
		.gold{
			background-color: yellow;
		}

		.row {
			padding: 0px;
			margin: 0px;
			clear: both;
		}
		.sky{
			background-color: #87CEEB;
		}
		.stone{
			background-color: lightgray;
		}

	</style>
</head>
<body>
	<div id="map"></div>
	<div>
		Day: <span id="day">0</span>
		Moves left: <span id="moves_left">0</span>
		Money: $<span id="money">0</span> 
		<span id="money_stats">
			[<span id="balance">0</span>] 
			<span id='expense_label'>(-<span id='expenses'>0</span>)</span>
		</span>
		
		
	</div>
	<div id="buy_menu">
		
	</div><div>
		<button id="next" disabled>next day</button>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
	<script src='https://code.jquery.com/jquery-3.6.0.js'></script>
	<script src='js/Config.js'></script>
	<script src='js/MapEvent.js'></script>
	<script src='js/MapGenerator.js'></script>
	<script src='js/Map.js'></script>
	<script src='js/Building.js'></script>
	<script src='js/Player.js'></script>
	<script src='js/Input.js'></script>
	<script src='js/Game.js'></script>
	<script src='js/Loop.js'></script> 
	<script src='js/Building.js'></script> 
	<script src='js/Input.js'></script> 
	<script src='js/Player.js'></script> 
	<script src='js/MapEvent.js'></script> 
	<script src='js/Tile.js'></script> 
	<script src='js/MapGenerator.js'></script> 

	<!--
	<script src='js/ '></script> 
	-->


	<script src='js/events.js'></script>
	<script src='js/js.js'></script>

</body>
</html>
